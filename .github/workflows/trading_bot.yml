name: Automated Trading Bot

on:
  # Runs Monday through Friday at 14:30 UTC (9:30 AM EST / Market Open)
  schedule:
    - cron: '30 14 * * 1-5'
  workflow_dispatch: # Allows you to run the bot manually anytime with a button click!

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas alpaca-py google-genai

      - name: Run Trading Bot Script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python trade.py

      # 👇 ADDED: This saves trade_log.csv back to your repository automatically
      - name: Commit and push updated trade log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update trade log [skip ci]"
          file_pattern: "trade_log.csv"
